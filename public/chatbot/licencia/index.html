<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente Licencia — San Vicente</title>
  <style>
    /* Tema San Vicente — paleta mapeada al sitio Municipalidad de San Vicente */
    :root, :host {
      --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      /* ════════ MARCA — único bloque a tocar por cliente ════════
         En embebido hereda del sitio (--color-primario*); standalone usa el fallback. */
      --brand:        var(--color-primario, var(--brand));
      --brand-hover:  var(--color-primario-hover, var(--brand-hover));
      --brand-dark:   var(--brand-dark);
      --brand-darker: var(--brand-darker);
      --brand-soft:   var(--color-primario-suave, var(--brand-soft));
      --brand-border: var(--brand-border);
      --brand-strong: var(--brand-strong);
      --brand-ink:    #ffffff;

      /* ════════ Semánticos (no cambian con la marca) ════════ */
      --success:var(--success); --success-soft:var(--success-soft); --success-border:var(--success-border); --success-ink:var(--success-ink);
      --warn-soft:var(--warn-soft); --warn-border:var(--warn-border); --warn-ink:var(--warn-ink);
      --danger:var(--danger);

      /* ════════ Neutrales / superficie ════════ */
      --color-text-primary: #1E293B;
      --color-text-secondary: #64748b;
      --color-background-primary: #ffffff;
      --color-background-secondary: #F8FAFC;
      --color-border-secondary: #e2e8f0;
      --color-border-tertiary: #e2e8f0;
      --border-strong: #d4dae3;

      /* ════════ Escala / botones ════════ */
      --border-radius-md: 10px;
      --border-radius-lg: 12px;
      --btn-radius: 10px;
      --btn-pad-y: 11px;
      --btn-pad-x: 14px;
      --btn-gap: 8px;
      --btn-tr: .12s;
      --ring-w: 2px;
      --icon-sz: 14px;

      /* ════════ Aliases legacy (compat durante migración) ════════ */
      --sv-primario: var(--brand);
      --sv-primario-hover: var(--brand-hover);
      --sv-primario-suave: var(--brand-soft);
      --sv-primario-borde: var(--brand-border);
      --sv-primario-dark: var(--brand-dark);
      --sv-primario-darker: var(--brand-darker);
    }
    body {
      background: #F8FAFC;
      min-height: 100dvh;
      margin: 0;
      padding: 0 12px;
      scrollbar-gutter: stable both-edges;
    }
  </style>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent}
#cw{font-family:var(--font-sans,sans-serif);max-width:620px;margin:0 auto;padding:1.5rem 0 3.5rem}
#msgs{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;align-items:flex-start;gap:10px;scroll-margin-top:14px}
.msg.user{flex-direction:row-reverse}
.bubble{position:relative;max-width:90%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.65;color:var(--color-text-primary);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bot .bubble{background:#ffffff;border:1px solid #e2e8f0;border-radius:18px}
.user .bubble{background:var(--brand-soft);border:1px solid var(--brand-border);color:var(--brand-darker);border-radius:18px}
/* Tail / colita del globo */
.bot .bubble::before,
.bot .bubble::after,
.user .bubble::before,
.user .bubble::after{content:"";position:absolute;width:0;height:0;pointer-events:none}
.bot .bubble::after{left:-7px;top:12px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid #ffffff}
.bot .bubble::before{left:-9px;top:11px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:9px solid #e2e8f0}
.user .bubble::after{right:-7px;top:12px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:8px solid var(--brand-soft)}
.user .bubble::before{right:-9px;top:11px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:9px solid var(--brand-border)}
.av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-top:2px}
.bot .av{background:var(--brand);color:white}
.user .av{background:var(--brand-border);color:var(--brand-darker)}
#opts{margin-top:12px;scroll-margin-bottom:28px}
/* back */
.back-btn{background:transparent;border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:7px 12px;font-size:12px;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:10px;transition:background .12s;width:fit-content}
.back-btn:hover{background:var(--color-background-secondary)}
/* confirm btn */
.cbtn-confirm{background:var(--brand);color:white;border:none;border-radius:var(--border-radius-md);padding:10px 16px;font-size:13px;cursor:pointer;width:100%;font-weight:500;opacity:.32;pointer-events:none;transition:opacity .2s;margin-top:8px;display:block}
.cbtn-confirm:disabled,.cbtn-confirm[aria-disabled="true"]{opacity:.32;pointer-events:none;cursor:not-allowed}
.cbtn-confirm.on{opacity:1;pointer-events:all}
.cbtn-confirm.on:hover{opacity:.9}
/* single-select buttons */
.opt-btn{background:#fff;border:1px solid #d4dae3;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--color-text-primary);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:8px;width:100%;box-shadow:0 1px 2px rgba(15,23,42,.06);transition:background .12s,border-color .12s,box-shadow .12s,transform .06s}
.opt-btn:hover{background:var(--brand-soft);border-color:var(--brand)}
.opt-btn:active{transform:translateY(1px)}
.opt-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.opt-btn.sel{background:var(--brand-soft);border-color:var(--brand);border-width:1.5px}
.opt-btn.sel .lbl{color:var(--brand-dark);font-weight:600}
.opt-btn.dim{opacity:.45;cursor:not-allowed;box-shadow:none}
.opt-btn .ic{font-size:13px;width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:600}
.opt-btn:hover .ic,.opt-btn.sel .ic{background:#fff}
.opt-btn .ol{display:flex;flex-direction:column;gap:1px;flex:1}
.opt-btn .lbl{font-size:13.5px;color:var(--color-text-primary);font-weight:500}
.opt-btn .sub{font-size:11px;color:var(--color-text-secondary);font-weight:400}
/* Acción afirmativa primaria (ej. confirmar datos) */
.opt-btn.primary{background:var(--brand);border-color:var(--brand)}
.opt-btn.primary .lbl{color:#fff;font-weight:600}
.opt-btn.primary .sub{color:rgba(255,255,255,.85)}
.opt-btn.primary .ic{background:rgba(255,255,255,.22);color:#fff}
.opt-btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.opt-btn.primary:hover .ic{background:rgba(255,255,255,.28)}
/* badges */
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block;margin-bottom:6px}
.bi{background:var(--brand-soft);color:var(--brand-dark)}.bo{background:var(--success-soft);color:var(--success-ink)}.bw{background:var(--warn-soft);color:var(--warn-ink)}
/* boxes */
.ibox{background:var(--brand-soft);border:1px solid var(--brand-border);border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;color:var(--brand-dark);margin-top:8px;line-height:1.5}
.wbox{background:var(--warn-soft);border:1px solid var(--warn-border);border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;color:var(--warn-ink);margin-top:8px}
.gbox{background:var(--success-soft);border:1px solid var(--success-border);border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;color:var(--success-ink);margin-top:8px}
/* inputs */
input.date-inp,select.fsel{width:100%;font-size:13px;padding:9px 10px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);display:block;margin-top:6px}
/* Color de marca en los campos: deja claro dónde hay que continuar */
input.date-inp,select.fsel,.dni-inp,textarea.cmt-inp{border-color:var(--brand-strong);background:#FFF9F2}
input.date-inp:focus,select.fsel:focus,.dni-inp:focus,textarea.cmt-inp:focus{border-color:var(--brand);outline:2px solid var(--brand);outline-offset:2px}
.err{color:var(--danger);font-size:12px;margin-top:4px;display:none}
/* typing */
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--color-text-secondary);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* ── Collapsible subclass selector ── */
.clase-block{border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:8px;overflow:hidden}
.clase-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--color-background-primary);user-select:none;transition:background .12s}
.clase-toggle:hover{background:var(--color-background-secondary)}
.clase-toggle.has-sel{background:var(--brand-soft)}
.clase-toggle .ct-ic{font-size:16px;flex-shrink:0}
.clase-toggle .ct-info{flex:1}
.clase-toggle .ct-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.clase-toggle.has-sel .ct-name{color:var(--brand-dark)}
.clase-toggle .ct-sub{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.clase-toggle .ct-arrow{font-size:11px;color:var(--color-text-secondary);transition:transform .2s;flex-shrink:0}
.clase-toggle.open .ct-arrow{transform:rotate(90deg)}
.clase-subs{display:none;border-top:1px solid var(--color-border-tertiary)}
.clase-subs.open{display:block}
.sub-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid #d4dae3;cursor:pointer;transition:background .1s;background:var(--color-background-primary)}
.sub-row:last-child{border-bottom:none}
.sub-row:hover:not(.age-dim):not(.inc-row):not(.lock-row){background:var(--color-background-secondary)}
.sub-row.sel-row{background:var(--brand-soft)}
.sub-row.inc-row{background:#f1f5f9;cursor:default;border-left:3px solid #cbd5e1}
.sub-row.inc-row .sub-name{color:#64748b;font-weight:500}
.sub-row.inc-row .sub-desc{color:#94a3b8}
.sub-row.inc-row .chk{background:#cbd5e1;border-color:#cbd5e1}
.sub-row.lock-row{background:#f8fafc;cursor:default;opacity:.85;border-left:3px solid #e2e8f0}
.sub-row.lock-row .sub-name{color:#64748b}
.sub-row.lock-row .sub-desc{font-size:10px;color:#94a3b8;margin-top:2px}
.sub-row.lock-row .chk-ic{display:none!important}
.sub-row.age-dim{opacity:.38;cursor:not-allowed}
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--color-border-secondary);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.sel-row .chk{background:var(--brand);border-color:var(--brand)}
.inc-row .chk{background:#cbd5e1;border-color:#cbd5e1}
.chk-ic{width:11px;height:11px;display:none}
.sel-row .chk-ic,.inc-row .chk-ic{display:block}
.sub-body{flex:1}
.sub-name{font-size:13px;color:var(--color-text-primary);line-height:1.3}
.sel-row .sub-name{color:var(--brand-dark);font-weight:500}
.sel-row .chk-ic path{stroke:#fff!important}
.sub-row.inc-row .chk-ic path{stroke:#64748b!important}
.sub-desc{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.pill{font-size:10px;padding:1px 6px;border-radius:10px;margin-top:3px;display:inline-block;border:1px solid}
.pill-age{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
/* req list */
.rlist{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.ritem{border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--color-background-primary)}
.rnum{background:var(--brand);color:white;font-size:10px;font-weight:500;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rbody{font-size:13px;color:var(--color-text-primary);flex:1;line-height:1.4}
.rbody small{display:block;color:var(--color-text-secondary);font-size:12px;margin-top:2px}
.ract{padding:8px 12px;border-top:1px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.cta-btn{padding:8px 13px;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;border:1px solid;font-weight:500}
.cp{background:var(--brand);color:white;border-color:var(--brand)}
.cs{background:var(--color-background-primary);color:var(--brand);border-color:var(--brand-border)}
.cg{background:var(--success);color:white;border-color:var(--success)}
.cw{background:var(--brand);color:white;border-color:var(--brand)}
.cr{background:var(--danger);color:white;border-color:var(--danger)}
/* summary card */
.sc{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px 16px;margin-top:8px}
.sr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--color-border-tertiary);gap:12px}
.sr:last-child{border-bottom:none}
.sr span:first-child{color:var(--color-text-secondary);flex-shrink:0}
.sr span:last-child{font-weight:500;color:var(--color-text-primary);text-align:right}
/* turnero */
.tc{border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px;text-align:center;background:var(--color-background-primary);margin-top:8px}
.tc .ti{font-size:26px;margin-bottom:5px}
.tc h3{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.tc p{font-size:12px;color:var(--color-text-secondary);margin-bottom:10px;line-height:1.4}
/* sel summary tags */
.sel-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.stag{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--brand-soft);color:var(--brand-dark);border:1px solid var(--brand-border)}
.stag.prof{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-border)}
/* doc checklist */
.doc-section{margin-top:10px}
.doc-section>h4{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:8px}
.doc-chk-row{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding:8px 0;border-top:1px solid var(--color-border-tertiary)}
.doc-chk-row:first-of-type{border-top:none}
.doc-chk-row input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--brand);cursor:pointer}
.doc-chk-row .doc-chk-lbl{flex:1;font-size:13px;line-height:1.45}
.doc-chk-row .doc-chk-lbl small{display:block;color:var(--color-text-secondary);font-size:12px;margin-top:2px}
.sum-section{margin-top:16px;padding-top:12px;border-top:1px solid var(--color-border-tertiary)}
.sum-section>h4{font-size:13px;font-weight:600;margin-bottom:8px}
.chk-datos{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:1px solid var(--color-border-tertiary)}
.chk-datos input{margin-top:2px;accent-color:var(--brand)}
.dni-inp{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);letter-spacing:.05em}
.export-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.export-row .cta-btn,.export-row .opt-btn{flex:1;min-width:140px;justify-content:center}
.clase-block.prof-block-locked .clase-toggle{pointer-events:none;cursor:not-allowed;opacity:.62}
.clase-block.prof-block-locked .clase-toggle .ct-arrow{opacity:.45}
.fin-deriv .tc{text-align:left}
.fin-deriv .tc p{font-size:13px;line-height:1.5}
/* sequential requirements */
.req-item{border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:8px;overflow:hidden;transition:border-color .2s,background .2s}
.req-item.req-active{border-color:var(--brand)}
.req-item.req-pending{opacity:.42;pointer-events:none}
.req-item.req-done{border-color:var(--success);background:var(--success-soft)}
.req-hd{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.req-chk-icon{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--color-border-secondary);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:transparent;padding:0;background:none;font:inherit;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.req-active .req-chk-icon:hover{border-color:var(--brand);color:var(--brand)}
.req-done .req-chk-icon{background:#fff;border-color:var(--success);color:var(--success);cursor:default}
.req-act{padding:8px 12px 10px;border-top:1px solid var(--color-border-tertiary);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.req-pending .req-act{display:none}
.req-lotengo{background:var(--brand);color:white;border:none;border-radius:var(--border-radius-md);padding:8px 14px;font-size:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;margin-left:auto;transition:opacity .12s}
.req-lotengo:hover{opacity:.88}
.req-done .req-lotengo{display:none!important}
/* Botón principal de "Sacar turno" — destacado, claro, prioridad visual */
.cbtn-turno{
  margin-top:8px;
  padding:16px 20px;
  font-size:16px;
  font-weight:600;
  letter-spacing:.01em;
  border-radius:var(--border-radius-md);
  box-shadow:0 4px 14px rgba(15,23,42,.12);
  line-height:1.3;
}
.cbtn-turno:hover{box-shadow:0 6px 18px rgba(15,23,42,.18)}
/* ── Botón secundario "Ver / Descargar resumen" ── */
.cbtn-resumen{
  margin-top:10px;
  padding:12px 16px;
  font-size:14px;
  font-weight:500;
  background:var(--color-background-primary);
  color:var(--brand);
  border:1px solid var(--brand-border);
  border-radius:var(--border-radius-md);
  cursor:pointer;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .12s,border-color .12s;
}
.cbtn-resumen:hover{background:var(--brand-soft);border-color:var(--brand)}
.cbtn-resumen .ic{font-size:16px}
/* ── Lenguaje de interacción unificado para todos los botones del chat ──
   Radio ya unificado vía --border-radius-md; acá se igualan foco y press. */
.cbtn-confirm:focus-visible,.cbtn-resumen:focus-visible,.cta-btn:focus-visible,.back-btn:focus-visible,.req-lotengo:focus-visible,.req-chk-icon:focus-visible,.btn-cerrar:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;
}
.cbtn-confirm:not(:disabled):active,.cbtn-resumen:active,.cta-btn:active,.back-btn:active,.req-lotengo:active{
  transform:translateY(1px);
}
.cta-btn{transition:opacity .12s,transform .06s}
.cta-btn:hover{opacity:.92}
.btn-cerrar{
  background:var(--color-background-primary);color:var(--color-text-secondary);
  border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);
  padding:9px 14px;font-size:13px;cursor:pointer;
}
.btn-cerrar:hover{background:var(--color-background-secondary)}
/* ── Modal Turnero ── */
#turno-overlay{
  display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);
  z-index:1000;padding:20px 12px;overflow-y:auto;
}
#turno-overlay.open{display:flex;align-items:flex-start;justify-content:center}
.turno-modal{
  background:#fff;border-radius:var(--border-radius-lg);max-width:520px;width:100%;
  max-height:calc(100dvh - 40px);
  box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;
  margin:auto;
}
.turno-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 16px;border-bottom:1px solid var(--color-border-tertiary);background:#f8fafc;
}
.turno-toolbar h2{font-size:15px;font-weight:600;color:var(--color-text-primary);margin:0}
.turno-toolbar .btn-cerrar{
  background:transparent;border:1px solid var(--color-border-secondary);
  border-radius:var(--border-radius-md);padding:6px 12px;font-size:12px;cursor:pointer;
  color:var(--color-text-secondary);
}
.turno-body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1 1 auto;min-height:0}
.turno-foot{padding:12px 16px 14px;border-top:1px solid var(--color-border-tertiary);background:#fff;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.turno-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.turno-nav button{
  background:#fff;border:1px solid var(--color-border-secondary);
  border-radius:var(--border-radius-md);padding:6px 12px;font-size:14px;cursor:pointer;
}

/* ════════════════════ FASE 3: VIGENCIA Y COSTO ════════════════════
   Reglas tomadas de la tabla provincial:
     COMUNES (A excepto A.4, B, G):
       - Primera vez 18-20: 1 año
       - Renovación 19-20: 3 años
       - 21-65 (alta o renovación): 5 años
       - 66-70: 3 años
       - 71+: 1 año
     PROFESIONALES (A.4, C, D, E):
       - 21-45: 5 años | 46-65: 3 años | 66-70: 2 años | 71+: 1 año
   Si el trámite mezcla clases comunes y profesionales se aplica la regla profesional. */
function calcVigencia(edad,esProf,esAlta){
  if(esProf){
    if(edad>=21&&edad<=45)return 5;
    if(edad>=46&&edad<=65)return 3;
    if(edad>=66&&edad<=70)return 2;
    if(edad>=71)return 1;
    return null;
  }
  if(edad>=71)return 1;
  if(edad>=66)return 3;
  if(edad>=21)return 5;
  if(esAlta)return 1;
  if(edad>=19)return 3;
  return 1;
}

/* Tabla de costos (pesos):
   - Comunes  → 1 año $17.800 | 3 años $21.800 | 5 años $31.800
   - Profesionales → 1 año $36.000 | 2 años o más $38.000 */
const COSTOS_COMUNES={1:17800,3:21800,5:31800};
const COSTOS_PROF={1:36000,multi:38000};
function calcCosto(vigencia,esProf){
  if(vigencia==null)return null;
  if(esProf)return vigencia<=1?COSTOS_PROF[1]:COSTOS_PROF.multi;
  return COSTOS_COMUNES[vigencia]??null;
}

function fmtPesos(n){
  if(typeof n!=="number"||Number.isNaN(n))return "—";
  return "$"+n.toLocaleString("es-AR");
}

/** Calcula vigencia y costo a partir del estado actual S. */
function calcVigenciaCosto(){
  const esAlta=S.tipo==="alta"||S.tipo==="alta_forzada";
  const v=calcVigencia(S.edad,S.esProf,esAlta);
  const c=v!=null?calcCosto(v,S.esProf):null;
  return{vigencia:v,costo:c,esAlta};
}
/** Fechas en pantalla y en el resumen: día/mes/año (formato latino dd/mm/aaaa, desde ISO yyyy-mm-dd). */
function fmtFechaDMY(iso){
  if(!iso)return "—";
  const p=String(iso).split("-");
  if(p.length<3)return "—";
  const [y,m,d]=p;
  if(!y||!m||!d)return "—";
  return `${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`;
}
function fmtFechaHoraAhora(){
  const n=new Date();
  const d=String(n.getDate()).padStart(2,"0");
  const mo=String(n.getMonth()+1).padStart(2,"0");
  const y=n.getFullYear();
  const hh=String(n.getHours()).padStart(2,"0");
  const mi=String(n.getMinutes()).padStart(2,"0");
  return `${d}/${mo}/${y}, ${hh}:${mi}`;
}
function isoToDmy(iso){
  if(!iso)return "";
  const p=String(iso).split("-");
  if(p.length<3)return "";
  return `${String(p[2]).padStart(2,"0")}/${String(p[1]).padStart(2,"0")}/${String(p[0])}`;
}
function dmyToIso(dmy){
  const m=String(dmy||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m)return null;
  const dd=Number(m[1]),mm=Number(m[2]),yyyy=Number(m[3]);
  if(mm<1||mm>12||dd<1||dd>31)return null;
  const dt=new Date(yyyy,mm-1,dd);
  if(dt.getFullYear()!==yyyy||dt.getMonth()!==mm-1||dt.getDate()!==dd)return null;
  return `${String(yyyy).padStart(4,"0")}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
}

const SYMBOL_ICON={"✓":"check","✗":"x","⚠":"alert","↺":"refresh","+":"plus","?":"help","🗓":"calendar","📅":"calendar","›":"chevron","⬇":"download","📤":"share"};
/* Convierte símbolos conocidos a SVG; deja pasar SVG ya armado y emojis (clases/encuesta). */
function resolveIcon(raw){
  if(raw==null||raw==="")return ic("chevron");
  if(typeof raw==="string"&&raw.indexOf("<svg")===0)return raw;

function addBack(fn,lbl="Volver al paso anterior"){const b=document.createElement("button");b.className="back-btn";b.innerHTML=`${ic("back",14)}<span>${lbl}</span>`;b.onclick=()=>{clearOpts();fn();};opts.appendChild(b);}

/* Avanza la conversación anclando el ARRIBA del último globo del bot al tope del área visible
   (no el fondo): así las preguntas con contenido alto —ej. selector de clases— quedan siempre
   visibles y el resto del bloque se lee scrolleando hacia abajo. */
/* Contenedor scrolleable del chat. En la página municipal es el host <sv-asistente-licencia>
   (overflow:auto, contiene al shadow root). En standalone es el documento. Se resuelve de forma
   determinística (sin trepar ancestros), así el scroll NO mueve la página, solo el chat. */
function chatScroller(){
  const r=msgs.getRootNode&&msgs.getRootNode();
  if(r&&r.host)return r.host;
  return document.scrollingElement||document.documentElement;
}

/* Scrollea SOLO el contenedor del chat (no la página) para dejar `el` arriba ("start"),
   abajo ("end") o lo justo para verse ("nearest"). */
function chatScrollIntoView(el,block){
  if(!el)return;
  const margin=14;
  const sc=chatScroller();
  const root=document.scrollingElement||document.documentElement;
  const isRoot=(sc===root||sc===document.documentElement||sc===document.body);
  const er=el.getBoundingClientRect();
  const scTop=isRoot?0:sc.getBoundingClientRect().top;
  const curTop=isRoot?window.pageYOffset:sc.scrollTop;
  const elTopAbs=curTop+(er.top-scTop);
  const viewH=isRoot?window.innerHeight:sc.clientHeight;
  let top=curTop;
  if(block==="start")top=elTopAbs-margin;
  else if(block==="end")top=elTopAbs+er.height-viewH+margin;
  else{
    if(elTopAbs<curTop+margin)top=elTopAbs-margin;
    else if(elTopAbs+er.height>curTop+viewH-margin)top=elTopAbs+er.height-viewH+margin;
  }
  if(top<0)top=0;
  (isRoot?window:sc).scrollTo({top,behavior:"smooth"});
}

function advanceScroll(){
  const botMsgs=msgs.querySelectorAll(".msg.bot");
  const last=botMsgs[botMsgs.length-1];
  if(last)chatScrollIntoView(last,"start");
  else chatScrollIntoView(opts,"end");
}

/* ── Confirm button helper ── */
function makeConfirmBtn(label){
  const b=document.createElement("button");b.type="button";b.className="cbtn-confirm";b.textContent=label;b.disabled=true;b.setAttribute("aria-disabled","true");return b;
}
function activateBtn(b,label){b.classList.add("on");b.disabled=false;b.setAttribute("aria-disabled","false");if(label)b.textContent=label;}
function deactivateBtn(b){b.classList.remove("on");b.disabled=true;b.setAttribute("aria-disabled","true");}

/** Enter en el campo dispara el botón Confirmar cuando está activo (.on). */
function bindEnterSubmitInput(inputEl,btnEl){
  inputEl.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    if(!btnEl.classList.contains("on"))return;
    e.preventDefault();
    btnEl.click();
  });
}

/** Enter en el panel dispara la acción principal (Continuar / Ir al turno / enlace municipal) salvo en campos de texto o botones secundarios. */
function bindEnterToPrimaryButton(scopeEl,btnEl,opt){
  opt=opt||{};
  const reqOn=opt.requireOn!==false;
  if(window._optsEnterAbort){try{window._optsEnterAbort.abort();}catch(x){}}
  window._optsEnterAbort=new AbortController();
  const sig=window._optsEnterAbort.signal;
  scopeEl.addEventListener("keydown",function handler(e){
    if(e.key!=="Enter"||e.repeat)return;
    if(e.target===btnEl)return;
    const t=e.target;
    if(t.closest){
      if(t.closest("textarea"))return;
      const inp=t.closest("input");
      if(inp){
        const tp=inp.type;
        if(tp==="text"||tp==="email"||tp==="search"||tp==="tel"||tp==="password"||tp==="url")return;
        if(tp==="checkbox")return;
      }
      if(t.closest("select"))return;
    }
    if(t.classList&&(t.classList.contains("opt-btn")||t.classList.contains("back-btn")))return;
    if(t.closest&&(t.closest("button.cta-btn")||t.closest("a.cta-btn")))return;
    if(reqOn&&!btnEl.classList.contains("on"))return;
    if(!reqOn&&btnEl.classList.contains("cbtn-confirm")&&!btnEl.classList.contains("on"))return;
    e.preventDefault();
    btnEl.click();
  },{signal:sig});
}

/** Documentación: Enter en Sí/No (opt-btn) o Continuar cuando está habilitado. */
function bindEnterDocContinuar(scopeEl,goBtn){
  scopeEl.addEventListener("keydown",e=>{
    if(e.key!=="Enter"||e.repeat)return;
    const t=e.target;
    if(t&&t.closest&&t.closest("a"))return;
    if(t&&t.classList&&t.classList.contains("opt-btn")&&!t.classList.contains("dim")){
      e.preventDefault();
      t.click();
      return;
    }
    const cb=t&&t.closest&&t.closest("input[type=checkbox]");
    if(cb)return;
    if(!goBtn.classList.contains("on"))return;
    e.preventDefault();
    goBtn.click();
  });
}

/* ── Una opción = un tap (sin paso Confirmar intermedio) ── */
function pickOne(items,onPick,backFn,backLbl){
  clearOpts();if(backFn)addBack(backFn,backLbl);
  items.forEach((item,i)=>{
    const b=document.createElement("button");b.className="opt-btn"+(item.dim?" dim":"");
    b.innerHTML=`<span class="ic">${resolveIcon(item.icon)}</span><div class="ol"><span class="lbl">${item.label}</span>${item.sub?`<span class="sub">${item.sub}</span>`:""}</div>`;
    if(!item.dim)b.onclick=()=>onPick(item,i);
    opts.appendChild(b);
  });
  const firstBtn=opts.querySelector(".opt-btn:not(.dim)");
  if(firstBtn)firstBtn.focus({preventScroll:true});
  advanceScroll();
}

/* ── Date input + confirmación explícita ── */
function showDate(hint,backFn,onConfirm,savedVal,cfg){
  const mode=(cfg&&cfg.mode)||"nacimiento";
  clearOpts();if(backFn)addBack(backFn);
  if(hint){const hintEl=document.createElement("p");hintEl.className="sub-desc";hintEl.style.marginBottom="8px";hintEl.style.color="var(--color-text-secondary)";hintEl.textContent=hint;opts.appendChild(hintEl);}
  const inp=document.createElement("input");inp.type="text";inp.className="date-inp";inp.inputMode="numeric";inp.autocomplete="off";inp.maxLength=10;inp.placeholder="dd/mm/aaaa";
  if(savedVal)inp.value=isoToDmy(savedVal);
  const err=document.createElement("p");err.className="err";
  const btn=makeConfirmBtn(mode==="nacimiento"?"Confirmar fecha de nacimiento":"Confirmar fecha de vencimiento");
  function validacionFecha(){
    const iso=dmyToIso(inp.value);
    if(!iso){return{ok:false,msg:"Ingresá la fecha en formato dd/mm/aaaa."};}
    if(mode==="nacimiento"){
      const hoy=new Date();
      const maxIso=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}`;
      if(iso>maxIso)return{ok:false,msg:"La fecha de nacimiento no puede ser futura."};
    }
    return{ok:true,iso};
  }
  function syncBtn(){
    if(!inp.value){deactivateBtn(btn);err.style.display="none";return;}
    const v=validacionFecha();
    if(!v.ok){err.textContent=v.msg;err.style.display="block";deactivateBtn(btn);return;}
    err.style.display="none";
    activateBtn(btn,mode==="nacimiento"?"Confirmar fecha de nacimiento":"Confirmar fecha de vencimiento");
  }
  inp.addEventListener("input",()=>{
    const raw=inp.value.replace(/[^\d]/g,"").slice(0,8);
    let fmt=raw;
    if(raw.length>4)fmt=raw.slice(0,2)+"/"+raw.slice(2,4)+"/"+raw.slice(4);
    else if(raw.length>2)fmt=raw.slice(0,2)+"/"+raw.slice(2);
    inp.value=fmt;
    syncBtn();
  });
  inp.addEventListener("blur",()=>{
    const n=inp.value.replace(/[^\d]/g,"").slice(0,8);
    if(n.length===8)inp.value=`${n.slice(0,2)}/${n.slice(2,4)}/${n.slice(4,8)}`;
    syncBtn();
  });
  if(savedVal)syncBtn();
  btn.onclick=()=>{
    if(!inp.value)return;
    const v=validacionFecha();
    if(!v.ok){err.textContent=v.msg;err.style.display="block";return;}
    err.style.display="none";
    onConfirm(v.iso);
  };
  bindEnterSubmitInput(inp,btn);
  opts.appendChild(inp);opts.appendChild(err);opts.appendChild(btn);
  inp.focus({preventScroll:true});
  advanceScroll();
}

function showDni(backFn){
  clearOpts();if(backFn)addBack(backFn);
  const hint=document.createElement("p");hint.className="sub-desc";hint.style.marginBottom="8px";hint.style.color="var(--color-text-secondary)";
  hint.textContent="Sin puntos, solo números.";
  const inp=document.createElement("input");inp.type="text";inp.className="dni-inp";inp.inputMode="numeric";inp.autocomplete="off";inp.maxLength=10;inp.placeholder="Ej.: 38123456";
  if(S.dni)inp.value=S.dni;
  const err=document.createElement("p");err.className="err";
  const btn=makeConfirmBtn("Confirmar");
  function norm(v){return v.replace(/\D/g,"");}
  function syncBtn(){
    const n=norm(inp.value);
    if(n.length>=7&&n.length<=9){activateBtn(btn,"Confirmar");err.style.display="none";}
    else deactivateBtn(btn);
  }
  inp.addEventListener("input",()=>{inp.value=norm(inp.value);syncBtn();});
  if(S.dni)syncBtn();
  btn.onclick=()=>{
    const n=norm(inp.value);
    if(n.length<7||n.length>9){err.textContent="Ingresá un DNI válido (7 a 9 dígitos).";err.style.display="block";return;}
    S.dni=n;addUser(`DNI: ${n}`);paso1_loc();
  };
  bindEnterSubmitInput(inp,btn);
  opts.appendChild(hint);opts.appendChild(inp);opts.appendChild(err);opts.appendChild(btn);
  inp.focus({preventScroll:true});
  advanceScroll();
}

/* ── Select — confirma al elegir opción (sin segundo botón) ── */
function showSelect(optsList,placeholder,backFn,onConfirm,savedVal){

}

/* ══ COLLAPSIBLE MULTI-SELECT SUBCLASS SELECTOR ══
   cfg.yaTiene = códigos ya en licencia (solo modo ampliación): fila bloqueada, tono gris
   cfg.ocultarFueraEdad = true: solo lista subclases permitidas por edad (ej. licencias actuales); sin aviso prof tras B */
function showSubclasSelector(edad,presel,onConfirm,backFn,cfg){
  cfg=cfg||{};
  const yaTiene=new Set(cfg.yaTiene||[]);
  clearOpts();if(backFn)addBack(backFn);
  const preselF=(presel||[]).filter(c=>{
    const sc=SUBS.find(s=>s.cod===c);
    if(!sc)return false;
    if(cfg.ocultarFueraEdad)return edad>=sc.edad||yaTiene.has(c);
    return true;
  });
  const selSet=new Set(preselF.filter(c=>!yaTiene.has(c)));
  /* La preselección puede venir del conjunto EFECTIVO (elegidas + incluidas). Quitamos las
     subclases que sólo están por inclusión de otra elegida: en todo el flujo mostramos sólo
     lo que el usuario eligió, nunca lo que queda incluido automáticamente. */
  getIncluidas(selSet).forEach(c=>selSet.delete(c));
  const grupos=["A","B","C","D","E","F","G"];
  const rowMap={};
  const blockRefs=[];
  const blocksByGrupo={};
  const wrap=document.createElement("div");

  if(cfg.notaHtml){
    const nota=document.createElement("div");nota.className="ibox";nota.style.marginBottom="10px";
    nota.innerHTML=cfg.notaHtml;
    wrap.appendChild(nota);
  }

  function closeOtherBlocks(exceptBlock){
    blockRefs.forEach(({block,subsDiv,tog})=>{
      if(block!==exceptBlock){
        subsDiv.classList.remove("open");
        tog.classList.remove("open");
      }
    });
  }

  function appendGrupo(g){
    const subsAll=SUBS.filter(s=>s.grupo===g);
    const subs=cfg.ocultarFueraEdad
      ?subsAll.filter(sc=>edad>=sc.edad||yaTiene.has(sc.cod))
      :subsAll;
    if(!subs.length)return;
    const profLocked=edad<21&&["C","D","E"].includes(g)&&!cfg.ocultarFueraEdad;
    const block=document.createElement("div");block.className="clase-block"+(profLocked?" prof-block-locked":"");
    const tog=document.createElement("div");tog.className="clase-toggle";
    const head=subs[0];
    const subHint=profLocked?"No disponible hasta los 21 años":"Toca para ver subclases";
    tog.innerHTML=`<span class="ct-ic">${head.ic}</span><div class="ct-info"><div class="ct-name">${head.gLabel}</div><div class="ct-sub">${subHint}</div></div><span class="ct-arrow">▶</span>`;
    const subsDiv=document.createElement("div");subsDiv.className="clase-subs";

    tog.onclick=()=>{
      if(profLocked)return;
      const willOpen=!subsDiv.classList.contains("open");
      closeOtherBlocks(block);
      subsDiv.classList.toggle("open",willOpen);
      tog.classList.toggle("open",willOpen);
    };

    subs.forEach(sc=>{
      const canAge=edad>=sc.edad;
      const lockedYa=yaTiene.has(sc.cod);
      const row=document.createElement("div");row.className="sub-row";
      row.innerHTML=`<div class="chk"><svg class="chk-ic" viewBox="0 0 12 10"><path d="M1 5l3.5 3.5L11 1" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="sub-body">
          <div class="sub-name">${sc.label}</div>
          <div class="sub-desc">${lockedYa?"Ya figura en tu licencia actual — no hace falta volver a marcarla":sc.desc}</div>
          ${!canAge&&!lockedYa&&!sc.prof?`<span class="pill pill-age">Requiere ${sc.edad} años (tenés ${edad})</span>`:""}
        </div>`;
      row.dataset.cod=sc.cod;
      rowMap[sc.cod]={row,subsDiv,tog,block};
      if(!canAge&&!lockedYa){row.classList.add("age-dim");}
      else if(lockedYa){row.classList.add("lock-row");row.onclick=null;}
      else{
        row.onclick=()=>{
          const inc=getIncluidas(selSet);
          if(inc.has(sc.cod))return;
          selSet.has(sc.cod)?selSet.delete(sc.cod):selSet.add(sc.cod);
          updateSelector(row);
        };
      }
      subsDiv.appendChild(row);
    });
    block.appendChild(tog);block.appendChild(subsDiv);
    wrap.appendChild(block);
    blockRefs.push({block,subsDiv,tog});
    blocksByGrupo[g]=block;
  }

  appendGrupo("A");
  appendGrupo("B");
  if(edad<21&&!cfg.ocultarFueraEdad){
    const av=document.createElement("div");av.className="wbox";av.style.marginBottom="10px";av.style.fontSize="13px";av.style.lineHeight="1.5";
    av.textContent="Debés ser mayor de 21 años para tramitar las clases profesionales";
    wrap.appendChild(av);
  }
  appendGrupo("C");
  appendGrupo("D");
  appendGrupo("E");
  appendGrupo("F");
  appendGrupo("G");
  const firstBlock=wrap.querySelector(".clase-block");
  if(!firstBlock){
    const av0=document.createElement("div");
    av0.className="wbox";
    av0.style.marginBottom="10px";
    av0.textContent="No encontramos subclases para mostrar con tu edad actual. Revisá la fecha de nacimiento o volvé al paso anterior.";
    wrap.appendChild(av0);
  }

  const sumWrap=document.createElement("div");
  sumWrap.style.cssText="margin-top:10px;background:var(--color-background-secondary);border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;";
  const sumLbl=document.createElement("div");sumLbl.style.cssText="color:var(--color-text-secondary);font-size:12px;margin-bottom:4px;";sumLbl.textContent="Sin subclases seleccionadas";
  const tagWrap=document.createElement("div");tagWrap.className="sel-tags";
  sumWrap.appendChild(sumLbl);sumWrap.appendChild(tagWrap);
  wrap.appendChild(sumWrap);

  const errBox=document.createElement("div");errBox.className="wbox";
  errBox.style.cssText="margin-top:8px;display:none;font-size:13px;line-height:1.5";
  wrap.appendChild(errBox);

  function validarAcompanantes(eff){
    const arr=Array.from(eff);
    const errs=[];
    if(eff.has("F")){
      const tieneAcomp=arr.some(c=>/^[BCDE]/.test(c));
      if(!tieneAcomp)errs.push("La clase <strong>F</strong> debe ir acompañada de una clase B, C, D o E.");
    }
    if(eff.has("A.4")){
      const tieneOtraA=arr.some(c=>/^A\./.test(c)&&c!=="A.4");
      if(!tieneOtraA)errs.push("La clase <strong>A.4</strong> debe ir acompañada de otra clase A (A.2.1, A.2.2 o A.3).");
    }
    if(eff.has("D.3")){
      const acomp=["B.1","B.2","C","D.1","D.2","E.1","E.2"];
      const tieneAcomp=arr.some(c=>acomp.includes(c));
      if(!tieneAcomp)errs.push("La clase <strong>D.3</strong> debe ir acompañada de B.1 o D.1.");
    }
    return errs;
  }

  const btn=makeConfirmBtn("Continuar");
  btn.onclick=()=>{
    const effective=new Set(selSet);
    yaTiene.forEach(c=>effective.add(c));
    const inc=getIncluidas(selSet);
    inc.forEach(c=>effective.add(c));
    if(!effective.size)return;
    const errs=validarAcompanantes(effective);
    if(errs.length){
      errBox.innerHTML=errs.map(e=>`⚠ ${e}`).join("<br>");
      errBox.style.display="block";
      chatScrollIntoView(errBox,"nearest");
      return;
    }
    errBox.style.display="none";
    const arr=Array.from(effective);
    S.selUsuario=Array.from(selSet).sort((a,b)=>a.localeCompare(b));
    S.subclases=arr;
    S.esProf=arr.some(c=>SUBS.find(s=>s.cod===c)?.prof);
    onConfirm(arr);
  };
  wrap.appendChild(btn);

  function subclasEnterGlobal(e){
    if(e.key!=="Enter"||e.repeat)return;
    if(!btn.classList.contains("on"))return;
    const ae=document.activeElement;
    if(ae){
      if(ae.classList&&ae.classList.contains("back-btn"))return;
      if(ae.tagName==="INPUT"&&(ae.type==="text"||ae.type==="email"))return;
      if(ae.tagName==="TEXTAREA")return;
      if(ae.tagName==="BUTTON"&&(ae.classList.contains("cta-btn")||ae.classList.contains("opt-btn")))return;
    }
    e.preventDefault();
    btn.click();
  }
  window.addEventListener("keydown",subclasEnterGlobal,true);
  window._svEnterCleanup=function(){window.removeEventListener("keydown",subclasEnterGlobal,true);};

  opts.appendChild(wrap);

  function updateSelector(lastClickedRow){
    const inc=getIncluidas(selSet);
    Object.entries(rowMap).forEach(([cod,o])=>{
      const row=o.row;
      const sc=SUBS.find(s=>s.cod===cod);
      const canAge=edad>=sc.edad;
      const lockedYa=yaTiene.has(cod);
      row.className="sub-row";
      if(lockedYa){row.classList.add("lock-row");return;}
      if(!canAge){row.classList.add("age-dim");return;}
      let hint=row.querySelector(".inc-hint");
      if(inc.has(cod)){
        row.classList.add("inc-row");
        if(!hint){hint=document.createElement("div");hint.className="sub-desc inc-hint";hint.style.fontSize="10px";hint.style.color="#94a3b8";hint.style.marginTop="4px";hint.textContent="Incluida automáticamente con tu selección";row.querySelector(".sub-body").appendChild(hint);}
      } else {
        if(hint)hint.remove();
        if(selSet.has(cod))row.classList.add("sel-row");
      }
    });
    grupos.forEach(g=>{
      const blockEl=blocksByGrupo[g];
      if(!blockEl)return;
      const subsAll=SUBS.filter(s=>s.grupo===g);
      const subs=cfg.ocultarFueraEdad
        ?subsAll.filter(sc=>edad>=sc.edad||yaTiene.has(sc.cod))
        :subsAll;
      const hasSel=subs.some(s=>selSet.has(s.cod)||yaTiene.has(s.cod)||inc.has(s.cod));
      const bt=blockEl.querySelector(".clase-toggle");
      const nSel=subs.filter(s=>selSet.has(s.cod)).length;
      const subEl=bt.querySelector(".ct-sub");
      bt.classList.toggle("has-sel",hasSel);
      if(blockEl.classList.contains("prof-block-locked")){
        subEl.textContent="No disponible hasta los 21 años";
        return;
      }
      if(yaTiene.size){
        subEl.textContent=nSel?`${nSel} nueva${nSel>1?"s":""}`:(hasSel?"Incluidas por tu licencia":"Toca para ver subclases");
      } else {
        subEl.textContent=nSel?`${nSel} seleccionada${nSel>1?"s":""}`:(hasSel?"Ver subclases":"Toca para ver subclases");
      }
    });
    tagWrap.innerHTML="";
    const totalEff=new Set(selSet);inc.forEach(c=>totalEff.add(c));yaTiene.forEach(c=>totalEff.add(c));
    const soloSel=Array.from(selSet).sort((a,b)=>a.localeCompare(b));
    const liveErrs=selSet.size?validarAcompanantes(totalEff):[];
    if(liveErrs.length){
      errBox.innerHTML=liveErrs.map(e=>`⚠ ${e}`).join("<br>");
      errBox.style.display="block";
    } else {
      errBox.style.display="none";
    }
    if(totalEff.size===0){
      sumLbl.textContent="Sin subclases seleccionadas";
      deactivateBtn(btn);btn.textContent="Continuar";
    } else {
      sumLbl.textContent=soloSel.length?"Subclases elegidas por vos:":"Elegí al menos una subclase:";
      soloSel.forEach(c=>{
        const sc=SUBS.find(s=>s.cod===c);
        const t=document.createElement("span");t.className="stag"+(sc&&sc.prof?" prof":"");t.textContent=c;
        tagWrap.appendChild(t);
      });
      if(liveErrs.length){
        deactivateBtn(btn);
        btn.textContent=`Falta clase acompañante (${soloSel.length} seleccionada${soloSel.length!==1?"s":""})`;
      } else {
        activateBtn(btn,`Continuar (${soloSel.length} seleccionada${soloSel.length!==1?"s":""})`);
      }
    }
    if(lastClickedRow&&lastClickedRow.dataset.cod){
      const ref=rowMap[lastClickedRow.dataset.cod];
      if(ref){ref.subsDiv.classList.remove("open");ref.tog.classList.remove("open");}
    }
  }

  updateSelector();
  advanceScroll();
}

/* Aplica un estado de vencimiento sin necesidad de fecha exacta.
   estado: "vigente" | "vencida_reciente" | "vencida_antigua"
   etiquetaUsuario: lo que se mostró al usuario (para addUser) */
function paso3c_aplicarEstado(estado,etiquetaUsuario){
  if(etiquetaUsuario)addUser(etiquetaUsuario);
  if(estado==="vencida_antigua"){
    const eraRenovarIgual=S.modoPostLic==="renovar_igual";
    const eraAmpliar=S.modoPostLic==="ampliar";
    S.modoPostLic=null;
    S.tipo="alta_forzada";
    if(eraRenovarIgual&&S.licActuales&&S.licActuales.length){
      S.skipReselectSubs=true;
      S.subclases=[...S.licActuales];
      S.esProf=S.subclases.some(c=>SUBS.find(s=>s.cod===c)?.prof);
      void (async()=>{
        paso5_requisitos();
      })();
    } else if(eraAmpliar&&S.subclases&&S.subclases.length){
      S.skipReselectSubs=true;
      S.esProf=S.subclases.some(c=>SUBS.find(s=>s.cod===c)?.prof);
      void (async()=>{
        paso5_requisitos();
      })();
    } else {
      S.skipReselectSubs=false;
      paso3d_altaForzada();
    }
    return;
  }
  S.tipo="renovacion";
  if(S.modoPostLic==="renovar_igual"){
    S.tipo="renovacion_simple";
    S.subclases=[...S.licActuales];
    paso5_requisitos();
  } else if(S.modoPostLic==="ampliar"){
    S.tipo="renovacion_ampliacion";
    paso5_requisitos();
  }
}

/** Compartir + copiar + correo simple (sin cuadro de destinatario). */
function appendExportToolbar(parent,txt){
  const subj=encodeURIComponent(`Licencia de conducir — DNI ${S.dni||""} — ${S.localidad||""}`);
  const body=encodeURIComponent(txt);
  const row=document.createElement("div");row.className="export-row";

  const bSh=document.createElement("button");bSh.type="button";bSh.className="cta-btn cg";bSh.innerHTML="⇄ Compartir resumen";
  bSh.onclick=async()=>{
    if(typeof navigator.share==="function"){
      try{
        await navigator.share({title:"Resumen — Licencia de conducir",text:txt});
        return;
      }catch(e){
        if(e&&e.name==="AbortError")return;
      }
    }
    try{
      await navigator.clipboard.writeText(txt);
      alert("Tu navegador no abre el panel de compartir aquí. Copiamos el resumen al portapapeles para que lo pegues donde quieras.");
    }catch(err){
      alert("No se pudo compartir ni copiar. Usá «Copiar resumen» o el correo más abajo.");
    }
  };
  row.appendChild(bSh);

  const bCp=document.createElement("button");bCp.type="button";bCp.className="cta-btn cg";bCp.innerHTML="📋 Copiar resumen";
  bCp.onclick=async()=>{
    try{
      await navigator.clipboard.writeText(txt);
      alert("Resumen copiado al portapapeles.");
    }catch(e){
      alert("No se pudo copiar. Seleccioná el texto desde el correo o contactá por WhatsApp.");
    }
  };
  row.appendChild(bCp);

  const bMail=document.createElement("button");bMail.type="button";bMail.className="cta-btn cp";bMail.innerHTML="✉ Enviar por correo";
  bMail.onclick=()=>{window.location.href=`mailto:?subject=${subj}&body=${body}`;};
  row.appendChild(bMail);

  parent.appendChild(row);
  return row;
}

/** Inserta un botón secundario "Ver / Descargar resumen" que abre el modal del resumen completo. */
/* Resumen del trámite: el PDF ES el resumen, así que ofrecemos descargar/compartir
   directamente (sin paso intermedio de "ver resumen", que mostraba lo mismo). */
/* onUsed (opcional): se dispara cuando el usuario descarga o comparte, para habilitar
   acciones posteriores (ej. "Finalizar") y evitar que se pierda el resumen. */
function appendResumenBtn(parent,onUsed){
  const bDown=document.createElement("button");
  bDown.type="button";bDown.className="cbtn-resumen";
  bDown.innerHTML=`<span class="ic">${ic("download",15)}</span><span>Descargar resumen (PDF)</span>`;
  bDown.onclick=()=>{descargarResumenPDF(bDown);if(onUsed)onUsed();};
  parent.appendChild(bDown);

  /* "Compartir" solo si el navegador puede compartir archivos (mobile/Chrome/Safari). */
  try{
    const probe=new File([new Blob(["x"])],"x.pdf",{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[probe]})){
      const bShare=document.createElement("button");
      bShare.type="button";bShare.className="cbtn-resumen";
      bShare.innerHTML=`<span class="ic">${ic("share",15)}</span><span>Compartir resumen (PDF)</span>`;
      bShare.onclick=()=>{compartirResumenPDF(bShare);if(onUsed)onUsed();};
      parent.appendChild(bShare);
    }
  }catch(e){/* sin Web Share: queda solo Descargar */}
  return bDown;
}

/* ════════════════════ TURNERO: API mock + Modal ════════════════════
   Sustituir turneroApi por integración real cuando esté disponible.
   Contrato esperado:
   - getDias(fromIso, toIso) → Promise<string[]>  (ISO YYYY-MM-DD con cupo)
   - getHorarios(fechaIso)    → Promise<string[]> (HH:MM disponibles)
   - confirmar(fechaIso,hora,datos) → Promise<{ok:boolean,id?:string,error?:string}>
*/
const turneroApi={
  _slots:["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","14:00","14:30","15:00","15:30","16:00","16:30"],
  async getDias(fromIso,toIso){
    await new Promise(r=>setTimeout(r,180));
    const out=[];const ini=new Date(fromIso+"T00:00"),fin=new Date(toIso+"T00:00");
    for(let d=new Date(ini);d<=fin;d.setDate(d.getDate()+1)){
      const dow=d.getDay();
      if(dow===0||dow===6)continue;
      if((d.getDate()*7+d.getMonth())%5===0)continue;
      const yyyy=d.getFullYear();
      const mm=String(d.getMonth()+1).padStart(2,"0");
      const dd=String(d.getDate()).padStart(2,"0");
      out.push(`${yyyy}-${mm}-${dd}`);
    }
    return out;
  },
  async getHorarios(fechaIso){
    await new Promise(r=>setTimeout(r,140));
    const d=new Date(fechaIso+"T00:00");
    const seed=(d.getDate()+d.getMonth())%this._slots.length;
    return this._slots.filter((_,i)=>(i+seed)%3!==0);
  },
  async confirmar(fechaIso,hora,datos){
    await new Promise(r=>setTimeout(r,260));
    return{ok:true,id:"TRN-"+Date.now().toString(36).toUpperCase().slice(-6)};
  }
};

let _tModal={mes:null,disp:new Set(),dia:null,hora:null,horas:[],tipo:"",onConfirm:null};

function _tFmtMes(d){
  const s=d.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

async function openTurnoModal({tipoExamen,onConfirm}){
  const m=new Date();m.setDate(1);m.setHours(0,0,0,0);
  _tModal={mes:m,disp:new Set(),dia:null,hora:null,horas:[],tipo:tipoExamen||"Turno",onConfirm};
  document.getElementById("turno-title").textContent=`Reservar turno — ${_tModal.tipo}`;
  document.getElementById("turno-overlay").classList.add("open");
  document.body.style.overflow="hidden";
  if(typeof notifyParentModal==="function")notifyParentModal(true);
  await _tCargarMes();
  _tRender();
}

function closeTurnoModal(){
  document.getElementById("turno-overlay").classList.remove("open");
  document.body.style.overflow="";
  if(typeof notifyParentModal==="function")notifyParentModal(false);
}

async function _tCargarMes(){
  const m=_tModal.mes;
  const today=new Date();today.setHours(0,0,0,0);
  const ini=new Date(m.getFullYear(),m.getMonth(),1);
  const fin=new Date(m.getFullYear(),m.getMonth()+1,0);
  const desde=ini<today?today:ini;
  const isoF=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const dias=await turneroApi.getDias(isoF(desde),isoF(fin));
  _tModal.disp=new Set(dias);
}

function _tRender(){
  const m=_tModal.mes;
  document.getElementById("turno-mes-label").textContent=_tFmtMes(m);
  const cal=document.getElementById("turno-cal");
  cal.innerHTML="";
  const firstDow=(new Date(m.getFullYear(),m.getMonth(),1).getDay()+6)%7;
  const ultDia=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<firstDow;i++){
    const e=document.createElement("div");e.className="td empty";cal.appendChild(e);
  }
  for(let d=1;d<=ultDia;d++){
    const dt=new Date(m.getFullYear(),m.getMonth(),d);
    const iso=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const past=dt<today;
    const disp=_tModal.disp.has(iso)&&!past;
    const sel=_tModal.dia===iso;
    const b=document.createElement("button");
    b.type="button";b.className="td"+(past?" past":(disp?" ok":" no"))+(sel?" sel":"");
    b.textContent=d;
    if(disp)b.onclick=()=>_tPickDia(iso);
    else b.disabled=true;
    cal.appendChild(b);
  }
  // botón prev: no permitir antes del mes actual
  const tmes=new Date();tmes.setDate(1);tmes.setHours(0,0,0,0);
  const isPastMonth=m.getFullYear()<tmes.getFullYear()||(m.getFullYear()===tmes.getFullYear()&&m.getMonth()<=tmes.getMonth());
  document.getElementById("turno-prev").disabled=isPastMonth;
  _tRenderHorarios();
  _tRenderResumen();
}

async function _tPickDia(iso){
  _tModal.dia=iso;_tModal.hora=null;_tModal.horas=[];
  _tRender();
  document.getElementById("turno-horarios-titulo").textContent="Cargando horarios...";
  const horas=await turneroApi.getHorarios(iso);
  if(_tModal.dia!==iso)return;
  _tModal.horas=horas;
  _tRenderHorarios();
}

function _tRenderHorarios(){
  const cont=document.getElementById("turno-horarios");
  const tit=document.getElementById("turno-horarios-titulo");
  if(!_tModal.dia){tit.textContent="Elegí un día disponible";cont.innerHTML="";return;}
  const [y,mo,d]=_tModal.dia.split("-");
  tit.textContent=`Horarios ${d}/${mo}/${y}`;
  cont.innerHTML="";
  if(!_tModal.horas.length){
    const p=document.createElement("p");p.style.cssText="color:var(--danger);font-size:12px;grid-column:1/-1;text-align:center;margin:0";
    p.textContent="Sin horarios para ese día. Probá otro.";
    cont.appendChild(p);return;
  }
  _tModal.horas.forEach(h=>{
    const b=document.createElement("button");b.type="button";b.className="th"+(_tModal.hora===h?" sel":"");
    b.textContent=h;
    b.onclick=()=>{_tModal.hora=h;_tRenderHorarios();_tRenderResumen();};
    cont.appendChild(b);
  });
}

function _tRenderResumen(){
  const r=document.getElementById("turno-resumen");
  const btn=document.getElementById("btn-confirmar-turno");
  if(_tModal.dia&&_tModal.hora){
    const [y,mo,d]=_tModal.dia.split("-");
    r.textContent=`${d}/${mo}/${y} · ${_tModal.hora} hs`;
    r.classList.add("ok");
    activateBtn(btn);
  } else {
    r.textContent=_tModal.dia?"Elegí un horario":"Sin selección.";
    r.classList.remove("ok");
    deactivateBtn(btn);
  }
}

(function bindTurnoModal(){
  const ov=document.getElementById("turno-overlay");
  if(!ov)return;
  document.getElementById("btn-cerrar-turno").onclick=closeTurnoModal;
  ov.addEventListener("click",e=>{if(e.target===ov)closeTurnoModal();});
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&ov.classList.contains("open"))closeTurnoModal();
  });
  document.getElementById("turno-prev").onclick=async()=>{
    const m=new Date(_tModal.mes);m.setMonth(m.getMonth()-1);
    _tModal.mes=m;_tModal.dia=null;_tModal.hora=null;_tModal.horas=[];
    await _tCargarMes();_tRender();
  };
  document.getElementById("turno-next").onclick=async()=>{
    const m=new Date(_tModal.mes);m.setMonth(m.getMonth()+1);
    _tModal.mes=m;_tModal.dia=null;_tModal.hora=null;_tModal.horas=[];
    await _tCargarMes();_tRender();
  };
  document.getElementById("btn-confirmar-turno").onclick=async()=>{
    const btn=document.getElementById("btn-confirmar-turno");
    if(!_tModal.dia||!_tModal.hora||!btn.classList.contains("on"))return;
    deactivateBtn(btn);btn.textContent="Confirmando...";
    const res=await turneroApi.confirmar(_tModal.dia,_tModal.hora,{dni:S.dni,tipo:S.tipo,subclases:S.subclases});
    btn.textContent="Confirmar turno";activateBtn(btn);
    if(res.ok){
      S.turno={fecha:_tModal.dia,hora:_tModal.hora,id:res.id,examen:_tModal.tipo};
      const cb=_tModal.onConfirm;
      closeTurnoModal();
      if(typeof cb==="function")cb(S.turno);
    } else {
      alert("No se pudo confirmar el turno: "+(res.error||"intenta de nuevo."));
    }
  };
})();

/* ════════════════════ FASE 2: RESUMEN COMPLETO (modal + impresión) ════════════════════
   Genera una vista HTML completa del trámite con:
   - Datos personales y del trámite
   - Vigencia y costo (Fase 3)
   - Checklist de documentación
   - Links útiles (CENAT, Declaración Jurada, manual del conductor, Ley 13.133, libre de multas)
   El usuario puede descargar el resumen como PDF (window.print → "Guardar como PDF"). */

/* URLs de material y formularios. Si alguna no se conoce todavía, se deja como string vacío
   y el resumen muestra el ítem como "Próximamente disponible" en lugar de un link roto. */
const RES_URLS={
  cenat:"https://www.santafe.gov.ar/cenat/",
  declaracionJurada:"",   // pendiente: PDF de Declaración Jurada de Salud (cargar cuando esté disponible)
  manualConductor:"/chatbot/licencia/documentacion/Manual%20Conductor.pdf",

/** Determina si el trámite incluye examen teórico-práctico (alta, alta forzada o renovación con ampliación, no profesional). */
function tramiteIncluyeExamenTeorico(){
  if(S.esProf)return false;
  if(S.tipo==="renovacion_simple")return false;
  return S.tipo==="alta"||S.tipo==="alta_forzada"||S.tipo==="renovacion_ampliacion";
}


function notifyParentModal(open){
  try{window.parent&&window.parent!==window&&window.parent.postMessage({type:"sv-chatbot-modal",open:!!open},"*");}catch(e){}
}

/* ════════════════════ PDF descargable (pdfmake) ════════════════════
   Reemplaza window.print() por un PDF vectorial con links clickeables,
   apto para enviar por mail o WhatsApp. pdfmake se carga on-demand para
   no impactar el peso inicial del chatbot. */
const PDFMAKE_URLS=[
  "https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js",
  "https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"
];
let _pdfMakeLoading=null;
function loadPdfMake(){
  if(window.pdfMake&&window.pdfMake.vfs)return Promise.resolve();
  if(_pdfMakeLoading)return _pdfMakeLoading;
  _pdfMakeLoading=new Promise((res,rej)=>{
    const inject=src=>new Promise((r,j)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>r();s.onerror=()=>j(new Error("No se pudo cargar "+src));document.head.appendChild(s);});
    inject(PDFMAKE_URLS[0]).then(()=>inject(PDFMAKE_URLS[1])).then(res).catch(rej);
  });
  return _pdfMakeLoading;
}

/* Logo municipal para el PDF: se baja una vez y se cachea como dataURL base64
   (pdfmake necesita la imagen embebida, no una URL). Si falla, el PDF sale sin logo. */
let _logoDataUrl=null;
function loadLogoDataUrl(){
  if(_logoDataUrl!==null)return Promise.resolve(_logoDataUrl||null);
  const candidates=["/images/logo_muni_bandera.png","/images/Isologo_muni.png"];
  return (async()=>{
    for(const url of candidates){
      try{
        const r=await fetch(url);
        if(!r.ok)continue;
        const blob=await r.blob();
        const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
        _logoDataUrl=dataUrl;
        return dataUrl;
      }catch(e){/* probar siguiente candidato */}
    }
    _logoDataUrl="";   // marca "ya intentado, sin logo" para no reintentar en cada descarga
    return null;
  })();
}

function _filenamePDF(){
  const id=String(S.dni||"").replace(/\D/g,"")||"sin-dni";
  const n=new Date();
  const d=String(n.getDate()).padStart(2,"0");
  const mo=String(n.getMonth()+1).padStart(2,"0");
  const y=n.getFullYear();
  return `Resumen-Licencia-SanVicente-${id}-${y}${mo}${d}.pdf`;
}

/* Lee un color del tema (CSS custom property) resuelto a hex, para usarlo en el PDF
   (pdfmake no soporta var()). Embebido: lo toma del host; standalone: del :root. */
function themeVar(name,fallback){
  try{
    const host=document.querySelector("sv-asistente-licencia");
    const v=getComputedStyle(host||document.documentElement).getPropertyValue(name).trim();
    return v||fallback;
  }catch(e){return fallback;}
}

    }

}

function buildResumenDocDefinition(){
  const tipoLabel={
    alta:"Alta — primera licencia",
    alta_forzada:"Alta — vencida más de 1 año",
    renovacion_simple:"Renovación simple",
    renovacion_ampliacion:"Renovación con ampliación"
  }[S.tipo]||String(S.tipo||"—");

  const vc=calcVigenciaCosto();
  const vigTxt=vc.vigencia!=null?`${vc.vigencia} año${vc.vigencia===1?"":"s"}`:"—";
  const costoTxt=vc.costo!=null?fmtPesos(vc.costo):"—";
  const subSel=(S.selUsuario&&S.selUsuario.length)?S.selUsuario.join(", "):"—";
  const nacFmt=S.nac?fmtFechaDMY(S.nac):"—";

  const reqs=[
    {n:"DNI vigente",d:"Original y fotocopia de frente y dorso con todos los datos legibles."},
    {n:"Certificado CENAT",d:"Certificado Nacional de Antecedentes de Tránsito. Tramitar y pagar online; presentar pagado el día del turno."}
  ];
  if(!S.esProf)reqs.push({n:"Libre de multas municipal",d:"Verificá que no tenés infracciones pendientes. Si tenés multas, regularizá antes."});
  reqs.push({n:"Declaración Jurada de Salud",d:"Aptitudes psicofísicas (Art. 23 inc. c, Ley 13.133). Completala antes de ir al municipio."});

  const incluyeExamen=tramiteIncluyeExamenTeorico();
  const links=[
    {icon:"📄",titulo:"Certificado CENAT",desc:"Tramitalo y pagalo online antes del turno",url:RES_URLS.cenat},
    {icon:"🩺",titulo:"Declaración Jurada de Salud",desc:"Formulario para descargar y completar",url:RES_URLS.declaracionJurada}
  ];
  if(incluyeExamen){
    links.push({icon:"📚",titulo:"Manual del conductor (PDF)",desc:"Material de estudio para el examen teórico",url:RES_URLS.manualConductor});
    links.push({icon:"📝",titulo:"Simulador de examen teórico",desc:"Practicá online preguntas oficiales antes del examen",url:RES_URLS.simuladorExamen});
  }
  links.push({icon:"⚖",titulo:"Ley provincial 13.133",desc:"Marco normativo de licencias en Santa Fe",url:RES_URLS.ley13133});
  links.push({icon:"💬",titulo:"Libre de multas municipal",desc:"Solicitar por WhatsApp al municipio",url:RES_URLS.libreMultasWa});

  /* pdfmake no resuelve URLs relativas. Si la URL empieza con "/" la convertimos a absoluta
     usando el origin del sitio embebedor (window.parent) o del propio chatbot como fallback. */
  function toAbsUrl(u){
    if(!u)return "";
    if(/^https?:\/\//i.test(u))return u;
    if(/^mailto:|^tel:/i.test(u))return u;
    let origin="";
    try{origin=(window.parent&&window.parent!==window)?window.parent.location.origin:window.location.origin;}
    catch(e){origin=window.location.origin;}
    return origin+(u.startsWith("/")?u:"/"+u);
  }

  /* Colores de marca resueltos desde los tokens CSS (pdfmake no soporta var()). */
  const T={
    brand:themeVar("--brand","#c26d0e"),
    brandDark:themeVar("--brand-dark","#7a4309"),
    brandSoft:themeVar("--brand-soft","#fdf2e9"),
    brandBorder:themeVar("--brand-border","#f5c99b")
  };
  const content=[];
  /* Encabezado de marca: logo municipal a la izquierda + identificación a la derecha. */
  content.push({
    columns:[
      _logoDataUrl
        ?{image:_logoDataUrl,width:150,margin:[0,0,0,0]}
        :{text:"Municipalidad de San Vicente",style:"brandName",margin:[0,6,0,0]},
      {stack:[
        {text:"Asistente de Licencias de Conducir",style:"brandName",alignment:"right"},
        {text:"San Vicente · Santa Fe",style:"brandSub",alignment:"right"}
      ],margin:[0,10,0,0]}
    ],
    columnGap:10
  });
  content.push({canvas:[{type:"line",x1:0,y1:0,x2:515,y2:0,lineWidth:1,lineColor:T.brandBorder}],margin:[0,8,0,4]});
  content.push({text:"Resumen — Licencia de conducir",style:"h1"});
  content.push({text:`Generado el ${fmtFechaHoraAhora()}`,style:"meta"});

  content.push({text:"Datos personales",style:"h2"});
  content.push(_resumenTablaSimple([
    ["DNI",S.dni||"—"],
    ["Localidad de domicilio",S.localidad||"—"],
    ["Fecha de nacimiento",nacFmt],
    ["Edad",S.edad?`${S.edad} años`:"—"]
  ]));

  content.push({text:"Detalle del trámite",style:"h2"});
  content.push(_resumenTablaSimple([
    ["Tipo de trámite",tipoLabel],
    ["Categoría",S.esProf?"Profesional":"Común / particular"],
    ["Subclases seleccionadas",subSel],
    ["Ámbito de gestión",S.tramiteLocal?"San Vicente (turno local)":"Otro municipio"]
  ]));

  content.push({text:"Vigencia y costo estimado",style:"h2"});
  content.push({
    table:{
      widths:["*","auto"],
      body:[[
        {stack:[
          {text:[{text:"Vigencia estimada: ",fontSize:10},{text:vigTxt,bold:true,fontSize:11}]},
          {text:`Calculado según edad${S.esProf?" y categoría profesional":""}.`,fontSize:9,color:"#64748b",margin:[0,2,0,0]}
        ],margin:[10,10,8,10],fillColor:T.brandSoft},
        {text:costoTxt,style:"pagoMonto",margin:[12,12,12,12],fillColor:T.brandSoft,alignment:"right"}
      ]]
    },
    layout:"noBorders"
  });

  if(S.tipo==="renovacion_ampliacion"){
    content.push({text:[{text:"Aviso (ampliación): ",bold:true},"la vigencia de las nuevas subclases se alineará al vencimiento de tu licencia actual (Art. 28, Ley 13.133). El monto final puede ajustarse al confirmar el trámite en el municipio."],style:"nota"});
  }

  if(S.turno){
    content.push({text:"Turno reservado",style:"h2"});
    content.push(_resumenTablaSimple([
      ["Examen",S.turno.examen],
      ["Fecha y hora",`${fmtFechaDMY(S.turno.fecha)} · ${S.turno.hora} hs`],
      ["Código de turno",S.turno.id]
    ]));
  }

  content.push({text:"Documentación a presentar",style:"h2"});
  reqs.forEach((r,i)=>{
    content.push({
      columns:[
        {width:14,text:"☐",fontSize:11,margin:[0,1,0,0]},
        {width:"*",stack:[
          {text:`${i+1}. ${r.n}`,bold:true,fontSize:10},
          {text:r.d,fontSize:9,color:"#64748b",margin:[0,1,0,0]}
        ]}
      ],
      margin:[0,3,0,6]
    });
  });

  content.push({text:"Links útiles",style:"h2"});
  links.forEach(l=>{
    if(!l.url){
      content.push({text:[
        {text:`${l.titulo}  `,bold:true,fontSize:10},
        {text:"— próximamente disponible",italics:true,fontSize:9,color:"#94a3b8"}
      ],margin:[0,2,0,6]});
      return;
    }
    const abs=toAbsUrl(l.url);
    content.push({
      stack:[
        {text:l.titulo,bold:true,fontSize:10,color:T.brand,decoration:"underline",link:abs},
        {text:l.desc,fontSize:9,color:"#64748b",margin:[0,1,0,1]},
        {text:abs,fontSize:8,color:"#94a3b8",link:abs}
      ],

    });
  });

  content.push({
    text:"Asistente municipal de licencias · San Vicente, Santa Fe\nDocumento generado automáticamente · Los montos son estimados y los confirma el municipio al momento del pago.",
    style:"firma"
  });

  return {
    content,
    info:{
      title:`Resumen Licencia ${S.dni||""}`.trim(),
      author:"Municipalidad de San Vicente",
      subject:"Resumen del trámite de licencia de conducir",
      keywords:"licencia, conducir, San Vicente, Santa Fe, trámite"
    },

            {text:"Centro de Licencias San Vicente · Buenos Aires 96 · Lun a Vie 7:30–13:00 hs · WhatsApp 3492 301207",fontSize:7,color:"#94a3b8",margin:[0,4,0,0]},
            {text:`Página ${currentPage} de ${pageCount}`,fontSize:7,color:"#94a3b8",alignment:"right",margin:[0,4,0,0]}
          ]}
        ]
      };
    },
    styles:{
      h1:{fontSize:17,bold:true,margin:[0,2,0,2],color:"#0F172A"},
      h2:{fontSize:12,bold:true,margin:[0,16,0,6],color:T.brandDark},
      brandName:{fontSize:12,bold:true,color:T.brandDark},
      brandSub:{fontSize:9,color:"#64748b",margin:[0,1,0,0]},
      sub:{fontSize:10,color:"#475569",margin:[0,0,0,2]},

async function descargarResumenPDF(btn){
  try{
    if(btn){btn.disabled=true;btn.dataset._lbl=btn.textContent;btn.textContent="Generando…";}
    await Promise.all([loadPdfMake(),loadLogoDataUrl()]);
    const def=buildResumenDocDefinition();
    pdfMake.createPdf(def).download(_filenamePDF());
  }catch(e){
    alert("No se pudo generar el PDF. Probá imprimir como alternativa.");
    console.error("[resumen pdf]",e);
  }finally{
    if(btn){btn.disabled=false;if(btn.dataset._lbl)btn.textContent=btn.dataset._lbl;}
  }
}

async function compartirResumenPDF(btn){
  try{
    if(btn){btn.disabled=true;btn.dataset._lbl=btn.textContent;btn.textContent="Generando…";}
    await Promise.all([loadPdfMake(),loadLogoDataUrl()]);
    const def=buildResumenDocDefinition();
    const fname=_filenamePDF();
    pdfMake.createPdf(def).getBlob(async blob=>{
      const file=new File([blob],fname,{type:"application/pdf"});
      try{
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Resumen Licencia",text:"Resumen del trámite de licencia de conducir."});
        }else{
          const url=URL.createObjectURL(blob);
          const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
          URL.revokeObjectURL(url);
        }
      }catch(e){if(e&&e.name!=="AbortError")console.warn("[share]",e);}
      if(btn){btn.disabled=false;if(btn.dataset._lbl)btn.textContent=btn.dataset._lbl;}
    });
  }catch(e){
    if(btn){btn.disabled=false;if(btn.dataset._lbl)btn.textContent=btn.dataset._lbl;}
    alert("No se pudo compartir el PDF.");console.error("[share pdf]",e);
  }
}
